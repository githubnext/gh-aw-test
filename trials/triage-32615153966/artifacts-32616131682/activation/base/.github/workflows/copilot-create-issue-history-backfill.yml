name: One-off Copilot Create Issue Release History Backfill

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: copilot-create-issue-release-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: ${{ matrix.tag }} / ${{ matrix.date }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # e2e.sh enables/disables one shared workflow, and that workflow has a
      # global concurrency group. Serial execution avoids cross-run races.
      max-parallel: 1
      matrix:
        include:
          - { tag: "v0.81.4", date: "2026-06-26", sha: "1db7b9b617011f63a991644b80bfd7e4a044c34e" }
