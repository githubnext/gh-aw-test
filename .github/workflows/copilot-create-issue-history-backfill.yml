name: One-off Copilot Create Issue Release History Backfill

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: copilot-create-issue-release-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: ${{ matrix.tag }} / ${{ matrix.date }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # e2e.sh enables/disables one shared workflow, and that workflow has a
      # global concurrency group. Serial execution avoids cross-run races.
      max-parallel: 1
      matrix:
        include:
          - { tag: "v0.80.9", date: "2026-06-22" }
          - { tag: "v0.81.2", date: "2026-06-24" }
          - { tag: "v0.81.4", date: "2026-06-26" }
          - { tag: "v0.81.5", date: "2026-06-27" }
          - { tag: "v0.81.6", date: "2026-06-27" }
          - { tag: "v0.82.0", date: "2026-06-29" }
          - { tag: "v0.82.1", date: "2026-06-30" }
          - { tag: "v0.82.2", date: "2026-07-02" }
          - { tag: "v0.82.3", date: "2026-07-07" }
          - { tag: "v0.82.4", date: "2026-07-08" }
          - { tag: "v0.82.5", date: "2026-07-08" }
          - { tag: "v0.82.6", date: "2026-07-08" }
          - { tag: "v0.82.7", date: "2026-07-09" }
          - { tag: "v0.82.8", date: "2026-07-11" }
          - { tag: "v0.82.9", date: "2026-07-13" }
          - { tag: "v0.82.10", date: "2026-07-16" }
          - { tag: "v0.82.11", date: "2026-07-16" }
          - { tag: "v0.82.12", date: "2026-07-17" }
          - { tag: "v0.82.14", date: "2026-07-20" }
          - { tag: "v0.82.15", date: "2026-07-21" }
          - { tag: "v0.83.0", date: "2026-07-22" }
          - { tag: "v0.83.1", date: "2026-07-23" }
          - { tag: "v0.83.2", date: "2026-07-24" }
          - { tag: "v0.83.3", date: "2026-07-25" }
          - { tag: "v0.83.4", date: "2026-07-27" }
          - { tag: "v0.83.5", date: "2026-07-29" }
          - { tag: "v0.84.0", date: "2026-07-29" }
          - { tag: "v0.84.1", date: "2026-07-31" }
          - { tag: "v0.84.2", date: "2026-08-01" }
          - { tag: "v0.84.3", date: "2026-08-03" }
          - { tag: "v0.84.4", date: "2026-08-04" }
          - { tag: "v0.86.1", date: "2026-08-07" }
          - { tag: "v0.86.2", date: "2026-08-11" }
          - { tag: "v0.86.3", date: "2026-08-15" }
          - { tag: "v0.87.0", date: "2026-08-16" }
          - { tag: "v0.87.1", date: "2026-08-18" }
          - { tag: "v0.87.2", date: "2026-08-20" }
          - { tag: "v0.87.4", date: "2026-08-22" }

    steps:
      - name: Checkout gh-aw-test main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gh-aw-test
          fetch-depth: 0
          token: ${{ secrets.GH_AW_TEST_PAT }}

      - name: Install published gh-aw extension at ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ secrets.GH_AW_TEST_PAT }}
        run: |
          set -euo pipefail
          gh extension remove github/gh-aw 2>/dev/null || true
          for attempt in 1 2 3; do
            if gh extension install github/gh-aw --pin "${{ matrix.tag }}"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install gh-aw extension after 3 attempts"
              exit 1
            fi
            sleep 90
          done
          gh aw --version

      - name: Set up Node.js
        uses: actions/setup-node@v5

      - name: Run live Copilot create-issue test
        working-directory: gh-aw-test
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ secrets.GH_AW_TEST_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_AW_TEST_PAT }}
          GH_AW_TEST_PAT: ${{ secrets.GH_AW_TEST_PAT }}
          GH_AW_TAG: ${{ matrix.tag }}
          HISTORY_DATE: ${{ matrix.date }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_AW_TEST_PAT:-}" ]]; then
            echo "::error::GH_AW_TEST_PAT is required"
            exit 1
          fi

          git config user.name "gh-aw-test history backfill"
          git config user.email "gh-aw-test-e2e@users.noreply.github.com"
          branch="history-copilot-create-issue-${GH_AW_TAG//./-}"

          # Deliberately omit both --use-samples and --gh-aw-ref: every entry
          # must call Copilot using the published gh-aw-actions release.
          ./e2e.sh \
            --branch "$branch" \
            --verbose \
            test-copilot-create-issue

      - name: Upload per-day harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-create-issue-${{ matrix.tag }}
          path: gh-aw-test/e2e-test-*.log
          if-no-files-found: warn