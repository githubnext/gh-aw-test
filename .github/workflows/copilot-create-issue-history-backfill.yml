name: One-off Copilot Create Issue History Backfill

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: copilot-create-issue-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: ${{ matrix.date }} / gh-aw@${{ matrix.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # e2e.sh enables/disables one shared workflow, and that workflow has a
      # global concurrency group. Serial execution avoids cross-run races.
      max-parallel: 1
