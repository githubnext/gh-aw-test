    steps:
      - name: Checkout gh-aw-test main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gh-aw-test
          fetch-depth: 0
          token: ${{ secrets.GH_AW_TEST_PAT }}

      - name: Checkout github/gh-aw at ${{ matrix.sha }}
        uses: actions/checkout@v4
        with:
          repository: github/gh-aw
          ref: ${{ matrix.sha }}
          path: gh-aw
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gh-aw/go.mod
          cache-dependency-path: gh-aw/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5

      - name: Run live Copilot create-issue test
        working-directory: gh-aw-test
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ secrets.GH_AW_TEST_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_AW_TEST_PAT }}
          GH_AW_TEST_PAT: ${{ secrets.GH_AW_TEST_PAT }}
          GH_AW_SHA: ${{ matrix.sha }}
          HISTORY_DATE: ${{ matrix.date }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_AW_TEST_PAT:-}" ]]; then
            echo "::error::GH_AW_TEST_PAT is required"
            exit 1
          fi

          git config user.name "gh-aw-test history backfill"
          git config user.email "gh-aw-test-e2e@users.noreply.github.com"
          branch="history-copilot-create-issue-${HISTORY_DATE//-/}"

          # Deliberately omit --use-samples: every entry must call Copilot.
          ./e2e.sh \
            --gh-aw-ref "$GH_AW_SHA" \
            --branch "$branch" \
            --verbose \
            test-copilot-create-issue

      - name: Upload per-day harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-create-issue-${{ matrix.date }}
          path: gh-aw-test/e2e-test-*.log
          if-no-files-found: warn