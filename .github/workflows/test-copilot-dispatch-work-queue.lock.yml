        env:
          GH_AW_WORK_QUEUE_ENABLED: "true"
          GH_AW_WORK_QUEUE_ROLE: "dispatcher"
          GH_AW_WORK_QUEUE_POLICY: "{\"authorization\":\"aw\",\"mode\":\"weighted-priority\",\"class_weights\":[8,4,2,1,1],\"accounting_weights\":{\"\":1},\"producers\":{},\"pools\":{\"default\":{\"default_profile\":\"phase-a-work-queue-worker\",\"profiles\":{\"phase-a-work-queue-worker\":{\"logical_contract\":\"8b5ecd42183c100a478f31c361ba367e95be7eeb43a9d338c8c0d6a3da8bc690\",\"workflow\":\".github/workflows/phase-a-work-queue-worker.lock.yml\",\"ref\":\"${{ github.sha }}\",\"trust_domain\":\"default\",\"credential_scope\":\"repository\",\"effect_scope\":\"${{ github.repository }}\",\"max_claims\":1,\"share_keys\":false}},\"logical_limit\":16,\"native_limit\":16,\"allowed_repositories\":[\"${{ github.repository }}\"],\"max_observation_age_ms\":60000,\"retry\":{\"max_attempts\":3,\"backoff_ms\":30000},\"reconciliation\":{\"max_attempts\":5,\"deadline_ms\":300000}}},\"limits\":{\"ledger_bytes\":67108864,\"recovery_bytes\":16777216,\"payload_bytes\":16384,\"graph_nodes\":4096,\"predecessors\":64,\"pending_nodes\":4096,\"operations\":256,\"assignment_bytes\":49152,\"result_bytes\":4096,\"evidence_bytes\":1024,\"observation_writes\":4096}}"
          GH_AW_WORK_QUEUE_DISPATCH_BUDGET: "1"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'write_work_queue_snapshot.cjs'));
            await main();
      - name: Inventory installed skills
        if: success() || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'skill_inventory.cjs'));
            await main();
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/work-queue.snapshot.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/system.txt
            /tmp/gh-aw/aw-prompts/user.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
