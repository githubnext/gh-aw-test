        env:
          GH_AW_WORK_QUEUE_ENABLED: "true"
          GH_AW_WORK_QUEUE_ROLE: "dispatcher"
          GH_AW_WORK_QUEUE_POLICY: "{\"authorization\":\"aw\",\"mode\":\"weighted-priority\",\"class_weights\":[8,4,2,1,1],\"accounting_weights\":{\"\":1},\"producers\":{},\"pools\":{\"default\":{\"default_profile\":\"phase-a-work-queue-worker\",\"profiles\":{\"phase-a-work-queue-worker\":{\"logical_contract\":\"8b5ecd42183c100a478f31c361ba367e95be7eeb43a9d338c8c0d6a3da8bc690\",\"workflow\":\".github/workflows/phase-a-work-queue-worker.lock.yml\",\"ref\":\"${{ github.sha }}\",\"trust_domain\":\"default\",\"credential_scope\":\"repository\",\"effect_scope\":\"${{ github.repository }}\",\"max_claims\":1,\"share_keys\":false}},\"logical_limit\":16,\"native_limit\":16,\"allowed_repositories\":[\"${{ github.repository }}\"],\"max_observation_age_ms\":60000,\"retry\":{\"max_attempts\":3,\"backoff_ms\":30000},\"reconciliation\":{\"max_attempts\":5,\"deadline_ms\":300000}}},\"limits\":{\"ledger_bytes\":67108864,\"recovery_bytes\":16777216,\"payload_bytes\":16384,\"graph_nodes\":4096,\"predecessors\":64,\"pending_nodes\":4096,\"operations\":256,\"assignment_bytes\":49152,\"result_bytes\":4096,\"evidence_bytes\":1024,\"observation_writes\":4096}}"
          GH_AW_WORK_QUEUE_DISPATCH_BUDGET: "1"
